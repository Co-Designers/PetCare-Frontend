<div class="search-page">
  <h2>{{ 'owner.search.title' | translate }}</h2>
  <app-owner-search-filters (searchEvent)="onSearch($event)" />

  @if (searching) {
    <div class="loading">{{ 'common.loading' | translate }}</div>
  } @else {
    @for (provider of results; track provider.id) {
      <app-owner-service-card [provider]="provider" (select)="onSelectProvider($event)" />
    }
    @if (results.length === 0 && !searching) {
      <div class="no-results">{{ 'owner.search.noResults' | translate }}</div>
    }
  }
</div>
